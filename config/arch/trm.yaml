name: recursive_reasoning.trm@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@ACTLossHead
  loss_type: stablemax_cross_entropy
  q_loss_coeff: 0.5

halt_exploration_prob: 0.1
halt_max_steps: 16

H_cycles: 3
L_cycles: 6
n_backwards_L: ${.L_cycles}   # number of with-grad L-level steps in the final pass; defaults to L_cycles for original TRM behavior

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8  # min(2, hidden_size // 64)
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

pos_encodings: rope
forward_dtype: bfloat16

mlp_t: False # use mlp on L instead of transformer
puzzle_emb_len: 16 # if non-zero, its specified to this value
no_ACT_continue: True # No continue ACT loss, only use the sigmoid of the halt which makes much more sense
q_logit_detach_model: False
q_logit_from_puzzle_emb: True # True -> Q-head reads from z_H[:, 0] (first puzzle_emb register); False -> mean-pool over non-puzzle_emb positions

# FixedPointTransformer settings that reproduce the original TRM block from the
# upstream fork (post-norm attention/MLP, plain residuals, no conv, no input
# injection norm).
softmax_temp: 1.0
norm_type: post-norm           # 'pre-norm' | 'peri-norm' | 'post-norm'
norm_placement: none           # 'input' | 'output' | 'none'
conv_type: none                # 'conv1d' | 'conv2d' | 'none'
conv_kernel_size: 4
conv_bias: false
residual_scale: null           # null | 'fixed' | 'input-independent' | 'input-dependent'
alpha_1_init: 0.5
alpha_2_init: 0.5
outer_only: false              # when true, alpha_1 is fixed at 1 and only alpha_2 is learned
normalize_input_injection: false
use_spec_norm_linear: false
