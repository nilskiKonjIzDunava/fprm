[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fprm"
version = "0.1.0"
description = "Fixed-Point Reasoners: Stable and Adaptive Deep Looped Transformers."
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core training stack
    "torch>=2.1",
    "coolname>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.66",
    "wandb>=0.16",

    # Configuration & validation
    "pydantic>=2.0",
    "argdantic>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",

    # Datasets / evaluation
    "huggingface_hub>=0.20",  # hf_hub_download in dataset/build_*.py
    "numba>=0.59",  # ARC evaluator (evaluators/arc.py)
    "abstract_algebra @ git+https://github.com/jopetty/abstract_algebra",

    # Model layers
    "einops>=0.7",
]

[tool.uv.sources]
# Pin torch to the CUDA 12.9 wheel index (matches a CUDA 12.9 driver). Remove
# this line and the [[tool.uv.index]] block below to install the default PyPI
# torch build instead.
torch = [{ index = "pytorch-cu129" }]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true  # only used by packages that opt in via [tool.uv.sources] above

[tool.setuptools]
# Prevent auto-discovery from trying to package every top-level directory; we just
# want a lightweight meta-package for dependency installation.
packages = []
